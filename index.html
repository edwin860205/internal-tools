<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>內部工具</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e7e5e0;
    --text: #1c1917;
    --text-muted: #78716c;
    --accent: #0f766e;
    --accent-light: #ecfdf5;
    --accent-border: #6ee7b7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .container {
    width: 100%;
    max-width: 480px;
  }
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .header p {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .logo {
    width: 48px;
    height: 48px;
    background: var(--accent);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 22px;
  }
  .tools {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tool-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  .tool-card:hover {
    border-color: var(--accent-border);
    box-shadow: 0 4px 16px rgba(15,118,110,0.08);
    transform: translateY(-1px);
  }
  .tool-card:active {
    transform: translateY(0);
  }
  .tool-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .tool-info {
    flex: 1;
    min-width: 0;
  }
  .tool-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
  }
  .tool-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .arrow {
    color: var(--text-muted);
    font-size: 16px;
    flex-shrink: 0;
  }
  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 11px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🏭</div>
    <h1>內部工具</h1>
    <p>請選擇要使用的工具</p>
  </div>

  <div class="tools">
    <a class="tool-card" href="%E6%9C%AA%E7%A2%BA%E8%AA%8D%E5%96%AE%E6%93%9A%E8%BF%BD%E8%B9%A4%E5%B7%A5%E5%85%B7_v2.html">
      <div class="tool-icon">📋</div>
      <div class="tool-info">
        <div class="tool-name">未確認單據追蹤工具</div>
        <div class="tool-desc">追蹤 ERP 未確認單據，標示新增與警示狀態</div>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="tool-card" href="%E5%B7%A5%E5%96%AE%E7%99%BC%E6%96%99%E9%80%B2%E5%BA%A6%E8%BF%BD%E8%B9%A4%E5%B7%A5%E5%85%B7_v2.html">
      <div class="tool-icon">🔧</div>
      <div class="tool-info">
        <div class="tool-name">工單發料進度追蹤工具</div>
        <div class="tool-desc">追蹤工單發料進度，標示缺料與落後工單</div>
      </div>
      <span class="arrow">›</span>
    </a>
  </div>

  <div class="footer">僅供內部使用</div>
</div>
</body>
</html>
